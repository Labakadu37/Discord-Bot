<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>RedSmile</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #000; font-family: "Segoe UI", system-ui, sans-serif; color: #fff; }

  #gate {
    position: fixed; inset: 0; z-index: 9000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px; text-align: center; padding: 24px;
    background: #0a0000;
  }
  #gate img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 60px #b71c1c; }
  #gate h1 { color: #e53935; font-size: 54px; letter-spacing: 2px; text-shadow: 0 0 30px #b71c1c; }
  #gate .warn {
    max-width: 560px; border: 2px solid #e53935; border-radius: 16px; padding: 20px 24px;
    background: rgba(40,0,0,.5); line-height: 1.6; font-size: 16px;
  }
  #gate .warn b { color: #ff1744; }
  button.big {
    font-size: 18px; font-weight: 700; padding: 14px 32px; border-radius: 12px; border: none;
    cursor: pointer; color: #fff;
  }
  #go { background: #c62828; } #go:hover { background: #e53935; }
  #cancel { background: #333; } #cancel:hover { background: #555; }
  .btns { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

  canvas { position: fixed; inset: 0; z-index: 1; display: none; }
  #flash { position: fixed; inset: 0; background: #ff1744; opacity: 0; pointer-events: none; z-index: 2; }

  .popup {
    position: fixed; width: 320px; z-index: 100; background: #141414; border: 1px solid #e53935;
    border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.6); overflow: hidden; user-select: none;
    animation: pop .18s ease-out;
  }
  @keyframes pop { from { transform: scale(.6); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .popup .bar {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: #8e0000;
    font-size: 13px; font-weight: 700; cursor: grab;
  }
  .popup .bar .x {
    margin-left: auto; width: 22px; height: 22px; border-radius: 4px; background: #c62828; color: #fff;
    display: grid; place-items: center; cursor: pointer; font-weight: 700;
  }
  .popup .body { display: flex; gap: 12px; padding: 14px; align-items: center; }
  .popup .body img { width: 54px; height: 54px; border-radius: 50%; object-fit: cover; flex: none; }
  .popup .body p { font-size: 14px; line-height: 1.4; }

  #stopbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9999; display: none;
    justify-content: center; padding: 14px; background: rgba(0,0,0,.7);
  }
  #stopbar button {
    font-size: 18px; font-weight: 900; padding: 14px 40px; border-radius: 12px; border: none;
    background: #c62828; color: #fff; cursor: pointer; letter-spacing: 1px;
  }
  #stopbar button:hover { background: #e53935; }

  #done {
    position: fixed; inset: 0; z-index: 10000; display: none; flex-direction: column; gap: 18px;
    align-items: center; justify-content: center; background: #050000; text-align: center; padding: 24px;
  }
  #done img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; }
  #done h2 { color: #e53935; font-size: 32px; }
</style>
</head>

const canvas = document.getElementById("c");

// --- Clones qui rebondissent ---
const clones = [];
const NUM_CLONES = 30;

function initClones() {
  clones.length = 0;
  const W = innerWidth, H = innerHeight;
  for (let i = 0; i < NUM_CLONES; i++) {
    const size = 40 + Math.random() * 100;
    const speed = 100 + Math.random() * 300;
    const angle = Math.random() * Math.PI * 2;
    clones.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      size, rotation: Math.random() * 360, rotSpeed: (Math.random() - 0.5) * 200,
      alpha: 0.5 + Math.random() * 0.5,
    });
  }
}

// --- Main smiley state ---
let mainScale = 0, mainRotation = 0, kick = 0, shake = 0, flashVal = 0;
let beatTimer = 0;
const BPM = 103;
const BEAT_INTERVAL = 60 / BPM;

// --- Waves ---
const waves = [];

// --- Animation loop ---
let lastTime = 0;

function frame(t) {
  if (!running) return;
  const dt = Math.min(0.05, (t - lastTime) / 1000);
  lastTime = t;

  const W = canvas.width = innerWidth;
  const H = canvas.height = innerHeight;
  const cx = W / 2, cy = H / 2;

  // Beat
  beatTimer += dt;
  if (beatTimer >= BEAT_INTERVAL) {
    beatTimer -= BEAT_INTERVAL;
    onBeat(cx, cy, W, H);
  }

  // Decay
  kick *= Math.pow(0.02, dt);
  shake *= Math.pow(0.01, dt);
  flashVal *= Math.pow(0.005, dt);
  mainScale += (1 - mainScale) * dt * 4;
  mainRotation += dt * 30;

  // Background
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  // Shake
  ctx.save();
  if (shake > 0.5) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // Waves
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i];
    w.radius += dt * 600;
    w.alpha -= dt * 1.5;
    if (w.alpha <= 0) { waves.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(cx, cy, w.radius, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(229, 57, 53, ${w.alpha})`;
    ctx.lineWidth = w.width;
    ctx.stroke();
  }

  // Clones
  clones.forEach(c => {
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.rotation += c.rotSpeed * dt;
    // Bounce
    if (c.x < -c.size) c.x = W + c.size;
    if (c.x > W + c.size) c.x = -c.size;
    if (c.y < -c.size) c.y = H + c.size;
    if (c.y > H + c.size) c.y = -c.size;

    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rotation * Math.PI / 180);
    ctx.globalAlpha = c.alpha;
    ctx.beginPath();
    ctx.arc(0, 0, c.size / 2, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(smileImg, -c.size / 2, -c.size / 2, c.size, c.size);
    ctx.restore();
  });

  // Main smiley
  const mainSize = Math.min(W, H) * 0.35 * (mainScale + kick * 0.3);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(mainRotation * Math.PI / 180 * 0.1);
  ctx.globalAlpha = 0.95;
  ctx.shadowColor = "#b71c1c";
  ctx.shadowBlur = 60;
  ctx.beginPath();
  ctx.arc(0, 0, mainSize / 2, 0, Math.PI * 2);
  ctx.closePath();
  ctx.clip();
  ctx.drawImage(smileImg, -mainSize / 2, -mainSize / 2, mainSize, mainSize);
  ctx.restore();

  // Title
  ctx.globalAlpha = 1;
  ctx.font = "bold 48px 'Segoe UI', system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.fillStyle = "#e53935";
  ctx.shadowColor = "#ff1744";
  ctx.shadowBlur = 20;
  ctx.fillText("RedSmile", cx, 70);
  ctx.shadowBlur = 0;

  ctx.restore();

  // Flash overlay
  if (flashVal > 0.01) {
    ctx.fillStyle = `rgba(213, 0, 0, ${flashVal})`;
    ctx.fillRect(0, 0, W, H);
  }

  // HTML flash
  document.getElementById("flash").style.opacity = flashVal > 0.1 ? flashVal * 0.5 : 0;

  raf = requestAnimationFrame(frame);
}

function onBeat(cx, cy, W, H) {
  kick = 1;
  const strong = Math.random() < 0.3;
  waves.push({ radius: Math.min(W, H) * 0.15, alpha: strong ? 0.7 : 0.4, width: strong ? 6 : 3 });

  // Push clones
  clones.forEach(c => {
    const angle = Math.random() * Math.PI * 2;
    const push = strong ? 500 : 250;
    c.vx += Math.cos(angle) * push;
    c.vy += Math.sin(angle) * push;
    // Dampen
    c.vx *= 0.85;
    c.vy *= 0.85;
  });

  if (strong) {
    flashVal = Math.max(flashVal, 0.4);
    shake = Math.max(shake, 15);
    // Spawn extra clones temporarily
    if (clones.length < 50) {
      const size = 30 + Math.random() * 80;
      const angle = Math.random() * Math.PI * 2;
      const speed = 200 + Math.random() * 400;
      clones.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        size, rotation: 0, rotSpeed: (Math.random() - 0.5) * 300,
        alpha: 0.7,
      });
    }
  }
}

// --- Sound : sirène infinie ---
function startSound() {
  try {
    audio = new (window.AudioContext || window.webkitAudioContext)();
    const master = audio.createGain();
    master.gain.value = 0.85;
    master.connect(audio.destination);

    // Sirène
    const osc = audio.createOscillator();
    osc.type = "sawtooth";
    const siren = audio.createGain(); siren.gain.value = 0.5;
    osc.connect(siren).connect(master);
    const t0 = audio.currentTime;
    for (let t = 0; t < 600; t += 0.6) {
      osc.frequency.setValueAtTime(420, t0 + t);
      osc.frequency.linearRampToValueAtTime(900, t0 + t + 0.3);
      osc.frequency.linearRampToValueAtTime(420, t0 + t + 0.6);
    }
    osc.start();

    // Bass pulse on beat
    const bassOsc = audio.createOscillator();
    bassOsc.type = "sine";
    bassOsc.frequency.value = 55;
    const bassGain = audio.createGain();
    bassGain.gain.value = 0;
    bassOsc.connect(bassGain).connect(master);
    bassOsc.start();
    for (let t = 0; t < 600; t += BEAT_INTERVAL) {
      bassGain.gain.setValueAtTime(0.6, t0 + t);
      bassGain.gain.linearRampToValueAtTime(0, t0 + t + 0.15);
    }

    // Noise
    const buf = audio.createBuffer(1, audio.sampleRate * 0.4, audio.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const noise = audio.createBufferSource(); noise.buffer = buf; noise.loop = true;
    const ng = audio.createGain(); ng.gain.value = 0.12;
    noise.connect(ng).connect(master); noise.start();
  } catch (e) {}
}
function stopSound() { try { audio && audio.close(); } catch (e) {} audio = null; }

// --- Popups ---
function spawnPopup() {
  if (!running || popupEls.length >= MAX_POPUPS) return;
  const el = document.createElement("div");
  el.className = "popup";
  el.style.left = Math.random() * Math.max(0, innerWidth - 320) + "px";
  el.style.top = Math.random() * Math.max(0, innerHeight - 160) + "px";
  el.innerHTML =
    '<div class="bar">RedSmile.exe <span class="x">✕</span></div>' +
    '<div class="body"><img src="' + SMILE_SRC + '"><p>' +
    MESSAGES[Math.floor(Math.random() * MESSAGES.length)] + '</p></div>';
  el.querySelector(".x").addEventListener("click", () => {
    el.remove(); popupEls = popupEls.filter(p => p !== el);
    spawnPopup(); spawnPopup(); spawnPopup();
  });
  // Draggable
  let ox, oy, drag = false;
  const bar = el.querySelector(".bar");
  bar.addEventListener("pointerdown", e => {
    if (e.target.classList.contains("x")) return;
    drag = true; ox = e.clientX - el.offsetLeft; oy = e.clientY - el.offsetTop;
    bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener("pointermove", e => {
    if (drag) { el.style.left = (e.clientX - ox) + "px"; el.style.top = (e.clientY - oy) + "px"; }
  });
  bar.addEventListener("pointerup", () => drag = false);

  document.body.appendChild(el);
  popupEls.push(el);
}

function start() {
  if (running) return;
  running = true;
  document.getElementById("gate").style.display = "none";
  document.getElementById("done").style.display = "none";
  canvas.style.display = "block";
  document.getElementById("stopbar").style.display = "flex";

  // Fullscreen
  try { document.documentElement.requestFullscreen(); } catch(e) {}

  initClones();
  mainScale = 0; mainRotation = 0; kick = 0; shake = 0; flashVal = 0; beatTimer = 0;
  lastTime = performance.now();
  startSound();
  raf = requestAnimationFrame(frame);

  // Popups de plus en plus vite
  let delay = 400;
  (function loop() {
    if (!running) return;
    spawnPopup();
    delay = Math.max(60, delay * 0.88);
    timers.push(setTimeout(loop, delay));
  })();
}

function stop() {
  running = false;
  cancelAnimationFrame(raf);
  timers.forEach(clearTimeout); timers = [];
  popupEls.forEach(p => p.remove()); popupEls = [];
  clones.length = 0; waves.length = 0;
  stopSound();
  canvas.style.display = "none";
  document.getElementById("stopbar").style.display = "none";
  document.getElementById("done").style.display = "flex";
  try { document.exitFullscreen(); } catch(e) {}
}

document.getElementById("go").addEventListener("click", start);
document.getElementById("cancel").addEventListener("click", () => window.close());
document.getElementById("stop").addEventListener("click", stop);
document.getElementById("again").addEventListener("click", start);

// Block Escape and Alt+F4 (best effort in browser)
addEventListener("keydown", e => {
  if (running && (e.key === "Escape" || (e.altKey && e.key === "F4"))) {
    e.preventDefault();
    spawnPopup(); spawnPopup();
  }
});
// Warn on close
addEventListener("beforeunload", e => {
  if (running) { e.preventDefault(); e.returnValue = ""; }
});
</script>
