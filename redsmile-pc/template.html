<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RedSmile</title>
<style>
  :root { --red: #e53935; --red2: #ff1744; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #000; font-family: "Segoe UI", system-ui, sans-serif; }
  body { color: #fff; }

  /* --- Écran d'avertissement --- */
  #gate {
    position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px; text-align: center; padding: 24px;
    background: #0a0000;
  }
  #gate img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 60px #b71c1c; }
  #gate h1 { color: var(--red); font-size: clamp(28px, 6vw, 54px); letter-spacing: 2px; }
  #gate .warn {
    max-width: 560px; border: 2px solid var(--red); border-radius: 16px; padding: 20px 24px;
    background: rgba(40,0,0,.5); line-height: 1.6; font-size: 16px;
  }
  #gate .warn b { color: var(--red2); }
  .btns { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  button.big {
    font-size: 18px; font-weight: 700; padding: 14px 26px; border-radius: 12px; border: none;
    cursor: pointer; color: #fff;
  }
  #go { background: #c62828; } #go:hover { background: #e53935; }
  #cancel { background: #333; } #cancel:hover { background: #555; }

  /* --- Scène --- */
  #stage { position: fixed; inset: 0; display: none; }
  #flash { position: fixed; inset: 0; background: var(--red2); opacity: 0; pointer-events: none; z-index: 1; }
  #bigsmile {
    position: fixed; inset: 0; margin: auto; width: 46vmin; height: 46vmin; border-radius: 50%;
    object-fit: cover; opacity: 0; pointer-events: none; z-index: 2;
    box-shadow: 0 0 80px #b71c1c; animation: beat .55s infinite;
  }
  @keyframes beat { 0%,100%{transform:scale(1)} 25%{transform:scale(1.12)} 40%{transform:scale(1)} }

  .popup {
    position: fixed; width: 300px; z-index: 5; background: #141414; border: 1px solid var(--red);
    border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.6); overflow: hidden; user-select: none;
    animation: pop .18s ease-out;
  }
  @keyframes pop { from { transform: scale(.6); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .popup .bar {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: #8e0000; cursor: grab;
    font-size: 13px; font-weight: 700;
  }
  .popup .bar .x {
    margin-left: auto; width: 22px; height: 22px; border-radius: 4px; background: #c62828; color: #fff;
    display: grid; place-items: center; cursor: pointer; font-weight: 700;
  }
  .popup .body { display: flex; gap: 12px; padding: 14px; align-items: center; }
  .popup .body img { width: 54px; height: 54px; border-radius: 50%; object-fit: cover; flex: none; }
  .popup .body p { font-size: 14px; line-height: 1.4; }

  #stopbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: none;
    justify-content: center; gap: 14px; padding: 12px; background: rgba(0,0,0,.65);
  }
  #stopbar button { font-size: 16px; font-weight: 700; padding: 12px 28px; border-radius: 10px; border: none;
    background: #fff; color: #b71c1c; cursor: pointer; }
  #hint { position: fixed; top: 10px; left: 0; right: 0; text-align: center; z-index: 50; color: #ff8a80;
    font-size: 13px; text-shadow: 0 0 6px #000; display: none; }

  #done {
    position: fixed; inset: 0; z-index: 2000; display: none; flex-direction: column; gap: 18px;
    align-items: center; justify-content: center; background: #050000; text-align: center; padding: 24px;
  }
  #done img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; }
  #done h2 { color: var(--red); font-size: 32px; }
</style>
</head>
<body>
  <!-- Avertissement : rien ne démarre avant le clic -->
  <div id="gate">
    <img src="data:image/jpeg;base64,__SMILE_B64__" alt="RedSmile">
    <h1>RedSmile</h1>
    <div class="warn">
      ⚠️ <b>Avertissement</b><br>
      Plusieurs <b>popups</b> peuvent apparaître et un <b>son fort</b> peut se déclencher.<br>
      C'est juste pour le fun : rien n'est installé, rien n'est modifié sur ton PC.<br>
      Pour tout arrêter : touche <b>Échap</b>, bouton <b>STOP</b>, ou ferme l'onglet.
    </div>
    <div class="btns">
      <button class="big" id="go">😈 Lancer</button>
      <button class="big" id="cancel">Annuler</button>
    </div>
  </div>

  <div id="stage">
    <div id="flash"></div>
    <img id="bigsmile" src="data:image/jpeg;base64,__SMILE_B64__" alt="">
  </div>

  <div id="hint">Échap pour tout arrêter</div>
  <div id="stopbar"><button id="stop">■ STOP</button></div>

  <div id="done">
    <img src="data:image/jpeg;base64,__SMILE_B64__" alt="">
    <h2>À la prochaine 🔴</h2>
    <button class="big" id="again" style="background:#c62828">Recommencer</button>
  </div>

<script>
const SMILE = "data:image/jpeg;base64,__SMILE_B64__";
const MESSAGES = [
  "Je te vois 👁", "Tu ne peux pas m'arrêter 😈", "RedSmile est partout",
  "ERREUR 666 : trop tard", "Surprise !", "Souris 🙂", "On s'amuse bien ?",
  "Encore un popup ?", "Je reviens toujours", "Boo! 👻"
];
const MAX_POPUPS = 60;          // borne : jamais infini, le PC ne rame pas
const DURATION_MS = 15000;      // s'arrête tout seul au bout de 15 s

let audio, running = false, timers = [], popups = [];

function rand(a, b) { return a + Math.random() * (b - a); }

/* --- Son (synthétisé, aucun fichier externe) : sirène + grésillement --- */
function startSound() {
  try {
    audio = new (window.AudioContext || window.webkitAudioContext)();
    const master = audio.createGain();
    master.gain.value = 0.9;             // fort
    master.connect(audio.destination);

    // Sirène qui monte et descend
    const osc = audio.createOscillator();
    osc.type = "sawtooth";
    const siren = audio.createGain(); siren.gain.value = 0.5;
    osc.connect(siren).connect(master);
    const t0 = audio.currentTime;
    for (let t = 0; t < DURATION_MS / 1000; t += 0.6) {
      osc.frequency.setValueAtTime(420, t0 + t);
      osc.frequency.linearRampToValueAtTime(900, t0 + t + 0.3);
      osc.frequency.linearRampToValueAtTime(420, t0 + t + 0.6);
    }
    osc.start(); osc.stop(t0 + DURATION_MS / 1000);

    // Grésillement
    const buf = audio.createBuffer(1, audio.sampleRate * 0.4, audio.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const noise = audio.createBufferSource(); noise.buffer = buf; noise.loop = true;
    const ng = audio.createGain(); ng.gain.value = 0.15;
    noise.connect(ng).connect(master); noise.start(); noise.stop(t0 + DURATION_MS / 1000);
  } catch (e) {}
}
function stopSound() { try { audio && audio.close(); } catch (e) {} audio = null; }

/* --- Popups --- */
function spawnPopup() {
  if (!running || popups.length >= MAX_POPUPS) return;
  const el = document.createElement("div");
  el.className = "popup";
  el.style.left = rand(0, Math.max(0, innerWidth - 300)) + "px";
  el.style.top = rand(0, Math.max(0, innerHeight - 160)) + "px";
  el.innerHTML =
    '<div class="bar">RedSmile.exe <span class="x">✕</span></div>' +
    '<div class="body"><img src="' + SMILE + '"><p>' +
    MESSAGES[Math.floor(Math.random() * MESSAGES.length)] + '</p></div>';
  // Fermer un popup en ouvre deux autres (classique), mais toujours borné
  el.querySelector(".x").addEventListener("click", () => {
    el.remove(); popups = popups.filter(p => p !== el);
    spawnPopup(); spawnPopup();
  });
  makeDraggable(el, el.querySelector(".bar"));
  document.body.appendChild(el);
  popups.push(el);
  flash();
}

function makeDraggable(el, handle) {
  let ox = 0, oy = 0, drag = false;
  handle.addEventListener("pointerdown", e => {
    if (e.target.classList.contains("x")) return;
    drag = true; ox = e.clientX - el.offsetLeft; oy = e.clientY - el.offsetTop;
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener("pointermove", e => {
    if (drag) { el.style.left = (e.clientX - ox) + "px"; el.style.top = (e.clientY - oy) + "px"; }
  });
  handle.addEventListener("pointerup", () => drag = false);
}

function flash() {
  const f = document.getElementById("flash");
  f.style.transition = "none"; f.style.opacity = "0.5";
  requestAnimationFrame(() => { f.style.transition = "opacity .25s"; f.style.opacity = "0"; });
}

function start() {
  if (running) return;
  running = true;
  document.getElementById("gate").style.display = "none";
  document.getElementById("done").style.display = "none";
  document.getElementById("stage").style.display = "block";
  document.getElementById("stopbar").style.display = "flex";
  document.getElementById("hint").style.display = "block";
  document.getElementById("bigsmile").style.opacity = "0.9";
  startSound();

  // Popups de plus en plus vite
  let delay = 500;
  (function loop() {
    if (!running) return;
    spawnPopup();
    delay = Math.max(90, delay * 0.9);
    timers.push(setTimeout(loop, delay));
  })();

  timers.push(setTimeout(stop, DURATION_MS));
}

function stop() {
  running = false;
  timers.forEach(clearTimeout); timers = [];
  popups.forEach(p => p.remove()); popups = [];
  stopSound();
  document.getElementById("bigsmile").style.opacity = "0";
  document.getElementById("stage").style.display = "none";
  document.getElementById("stopbar").style.display = "none";
  document.getElementById("hint").style.display = "none";
  document.getElementById("done").style.display = "flex";
}

document.getElementById("go").addEventListener("click", start);
document.getElementById("cancel").addEventListener("click", () => window.close());
document.getElementById("stop").addEventListener("click", stop);
document.getElementById("again").addEventListener("click", start);
addEventListener("keydown", e => { if (e.key === "Escape") stop(); });
</script>
</body>
</html>
