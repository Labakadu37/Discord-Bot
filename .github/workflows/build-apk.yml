name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew testReleaseUnitTest

      - name: Construire l'APK
        run: ./gradlew assembleRelease

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk BotHostinger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BotHostinger-apk
          path: BotHostinger.apk

      - name: Publier une release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BotHostinger.apk
