plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.botdl.telegram'
    compileSdk 35

    defaultConfig {
        applicationId 'com.botdl.telegram'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk {
            // Téléphones ARM ; `-Pabis=x86_64` pour tester sur un émulateur.
            abiFilters(*(findProperty('abis') ?: 'arm64-v8a,armeabi-v7a').split(','))
        }
    }

    // Clé de debug publique (mot de passe "android") : pas un secret, elle sert juste
    // à ce que chaque nouvelle version de l'APK s'installe par-dessus l'ancienne.
    signingConfigs {
        shared {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release {
            signingConfig signingConfigs.shared
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Le code Python du bot (bot.py, downloader.py...) est le même que pour la version PC.
def botSources = tasks.register('copyBotSources', Sync) {
    from(rootProject.projectDir.parentFile) { include '*.py' }
    into layout.buildDirectory.dir('botPython')
}

chaquopy {
    defaultConfig {
        version '3.11'
        pip {
            install '-r', '../../requirements.txt'
        }
    }
    sourceSets {
        main { srcDir botSources }
    }
}
